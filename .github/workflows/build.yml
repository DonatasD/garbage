name: Build & deploy calendar

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1" # Mondays 04:30 UTC — check for new schedules
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch latest schedules from nemenkom.lt and ecoservice.lt
        id: fetch
        run: |
          set +e
          node scripts/fetch.mjs 2>&1 | tee "$RUNNER_TEMP/fetch.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # exit 1 = a source could not be fetched/parsed; exit 2 = ok but some source files need manual review
          if [ "$code" != "0" ]; then
            echo "::warning::fetch.mjs exited with $code — building from committed data/schedule.json where needed"
          fi

      - name: Open issue if fetching schedules needs attention
        if: steps.fetch.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.fetch.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$EXIT_CODE" = "2" ]; then
            title="Schedule files on nemenkom.lt could not be parsed automatically — review needed"
            intro="scripts/fetch.mjs could not handle some schedule files on https://www.nemenkom.lt/buitiniu-ir-pakuociu-atlieku-surinkimo-grafikas/ (unknown file type, or our street row was not found). Other streams were updated automatically; check the affected dates in data/schedule.json by hand."
          else
            title="Fetching schedules failed — calendar will go stale"
            intro="scripts/fetch.mjs could not fetch or parse at least one source (see the log below). The calendar was built from the committed data/schedule.json, which stops receiving new dates until this is fixed."
          fi
          {
            echo "$intro"
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/fetch.log"
            echo '```'
          } > "$RUNNER_TEMP/issue-body.md"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue-body.md"
          fi

      - name: Commit updated schedule.json
        run: |
          if ! git diff --quiet data/schedule.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/schedule.json
            git commit -m "chore: update schedule from nemenkom.lt / ecoservice.lt"
            git push
          fi

      - name: Build ICS + site
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4

      - name: Open issue if the workflow failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Calendar build/deploy failed"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq length)
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" \
              --body "The Build & deploy calendar workflow failed. The published feed still serves the last successful build, but it will not receive updates until this is fixed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue comment "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" \
              --body "Failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
